<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Account | Youyou's Cookies</title>
  <link rel="icon" type="image/png" sizes="48x48" href="assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Minimal Header -->
  <div class="login-header">
    <a href="index.html" class="login-back-btn">← Back to Shop</a>
    <span class="login-brand">Youyou's Cookies</span>
  </div>

  <main class="login-wrapper">
    <div class="auth-card">
      <h2 id="auth-title">Welcome Back</h2>
      <p id="auth-subtitle" class="auth-subtitle">Sign in to track your sweet orders.</p>
      
      <!-- Google Button -->
      <button id="google-btn" class="btn-google">
        <svg width="22" height="22" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20c11 0 20-9 20-20 0-1.3-.2-2.6-.4-3.9z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-1.7 1.2-3.8 1.9-6.3 1.9-5.2 0-9.7-3.3-11.3-8l-6.6 4.8C9.7 39.7 16.3 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C44 34 44 24 44 24c0-1.3-.2-2.6-.4-3.9z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider-text">Or email</div>

      <!-- Email Form -->
      <form id="auth-form">
        <input type="text" id="username" class="auth-input" placeholder="Your Full Name" style="display: none;">
        <input type="email" id="email" class="auth-input" placeholder="Email Address" required>
        <input type="password" id="password" class="auth-input" placeholder="Password" required>
        <button type="submit" id="submit-btn" class="btn-auth">Sign In</button>
      </form>
      
      <div class="switch-mode">
        <span id="switch-text">New here?</span> 
        <a href="signup.html">Create an account</a>
      </div>
      
      <p id="error-msg" class="auth-error-msg" style="display: none;"></p>
    </div>
  </main>

  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
