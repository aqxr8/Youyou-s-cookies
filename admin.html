<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="48x48" href="assets/images/logo.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | YouYou's Cookies</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @media (max-width: 900px) {
      .admin-kpi-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; }
      .admin-main-grid { grid-template-columns: 1fr !important; gap: 20px !important; }
      .section.container { padding-left: 12px !important; padding-right: 12px !important; padding-top: 15px !important; }
      
      .kpi-card { padding: 18px 12px !important; text-align: center; border-radius: 16px; border-top-width: 5px; }
      .kpi-value { font-size: 1.7rem !important; }
      .kpi-label { font-size: 0.75rem !important; letter-spacing: 0.05em; }
      
      .profile-section-card { padding: 18px !important; border-radius: 20px; }
      
      .admin-filter-tabs { 
        width: 100%; 
        display: flex; 
        justify-content: space-between; 
        overflow-x: auto; 
        padding-bottom: 5px; 
      }
      .filter-btn, .filter-btn-review { flex: 1; text-align: center; padding: 10px 5px !important; font-size: 0.85rem !important; white-space: nowrap; }
      
      .admin-order-card { padding: 18px !important; border-radius: 16px; }
      .admin-order-header { flex-direction: column; align-items: flex-start !important; gap: 12px; }
      .admin-order-header > div { width: 100%; display: flex; justify-content: space-between; align-items: center; }
      .admin-order-header .status-pill-badge { align-self: flex-start; }
      
      .admin-order-card > div:last-child { 
        flex-direction: column !important; 
        align-items: stretch !important; 
        gap: 15px; 
      }
      .admin-order-card > div:last-child > div:first-child { 
        text-align: left; 
        font-size: 1.4rem !important; 
      }
      .admin-order-card > div:last-child > div:last-child { 
        display: flex !important; 
        flex-direction: row; 
        width: 100%; 
        gap: 10px;
      }
      .btn-whatsapp-sm, .admin-status-dropdown { 
        flex: 1; 
        text-align: center; 
        justify-content: center; 
        padding: 12px !important; 
        font-size: 0.9rem !important; 
        height: 44px !important; 
        box-sizing: border-box;
      }
    }
    .filter-btn-review {
      border: none;
      background: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--brown);
      font-weight: 600;
    }
    .filter-btn-review.active {
      background: var(--white);
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body style="background: var(--cream-light);">

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="assets/images/logo.png" alt="YouYou's Cookies" class="brand-logo">
        <div class="brand-text">
          <b>ADMIN CONTROL PANEL</b>
          <span>YOUYOU'S COOKIES</span>
        </div>
      </a>

      <div style="display: flex; align-items: center; gap: 15px;">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span class="moon-icon">🌙</span>
          <span class="sun-icon" style="display: none;">☀️</span>
        </button>
        <button id="logout-btn" class="btn btn-dark" style="padding: 8px 18px; font-size: 0.85rem;">Log Out</button>
      </div>
    </div>
  </header>

  <main class="section container" style="max-width: 1100px; padding-top: 30px;">
    
    <!-- Analytics KPI Cards -->
    <div class="admin-kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Total Revenue</div>
        <div id="stat-total-revenue" class="kpi-value">0 DH</div>
        <div class="kpi-sub">Lifetime orders</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Orders</div>
        <div id="stat-total-orders" class="kpi-value">0</div>
        <div class="kpi-sub">Submitted online</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Pending Delivery</div>
        <div id="stat-pending-orders" class="kpi-value" style="color: var(--caramel);">0</div>
        <div class="kpi-sub">Needs fulfillment</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Users</div>
        <div id="stat-total-users" class="kpi-value">0</div>
        <div class="kpi-sub">Customer accounts</div>
      </div>
    </div>

    <!-- Admin Main Content Grid -->
    <div class="admin-main-grid">
      
      <!-- Orders List -->
      <div class="profile-section-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
          <h3 class="profile-card-title" style="margin: 0;">Orders Management</h3>
          
          <div class="admin-filter-tabs">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="Processing">Pending</button>
            <button class="filter-btn" data-filter="Delivered">Delivered</button>
          </div>
        </div>

        <div id="admin-orders">
          <p style="color: var(--brown-soft); font-style: italic;">Loading live orders...</p>
        </div>
      </div>

      <!-- Right Column: Users List & Reviews Management -->
      <div style="display: flex; flex-direction: column; gap: 25px;">
        
        <!-- Customer Directory -->
        <div class="profile-section-card">
          <h3 class="profile-card-title">Customer Directory</h3>
          <div id="admin-users">
            <p style="color: var(--brown-soft); font-style: italic;">Loading users...</p>
          </div>
        </div>

        <!-- Reviews Management -->
        <div class="profile-section-card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
            <h3 class="profile-card-title" style="margin: 0;">Reviews Management</h3>
            
            <div class="admin-filter-tabs">
              <button class="filter-btn-review active" data-filter="all">All</button>
              <button class="filter-btn-review" data-filter="pending">Pending</button>
              <button class="filter-btn-review" data-filter="approved">Approved</button>
              <button class="filter-btn-review" data-filter="rejected">Rejected</button>
            </div>
          </div>

          <div id="admin-reviews">
            <p style="color: var(--brown-soft); font-style: italic;">Loading reviews...</p>
          </div>
        </div>

      </div>

    </div>

  </main>

  <script>
    // Order filter tabs
    document.querySelectorAll('.filter-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var status = btn.getAttribute('data-filter');
        document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        document.querySelectorAll('.admin-order-card').forEach(function (card) {
          card.style.display = (status === 'all' || card.getAttribute('data-status') === status) ? '' : 'none';
        });
      });
    });
  </script>

  <script src="assets/js/main.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
