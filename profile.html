          </div>

          <div class="pro-stat-box">

      </div>

      <!-- Dashboard Grid -->
      <div class="pro-dashboard-grid">
        
        <!-- Left Column: Settings & Security -->

          <!-- Account Settings Card -->

        <!-- Right Column: Order History -->

              <!-- Orders injected by JS -->

              </div>
            </div>
          </div>

  <!-- Include your JS scripts -->
  <script src="assets/js/firebase-init.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/features.js"></script>

  <!-- JS to handle order counting and password updates smoothly -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Observer for order counting
      const ordersList = document.getElementById("user-orders-list");
      const statCount = document.getElementById("stat-orders-count");
      
      if(ordersList && statCount) {
        const observer = new MutationObserver(() => {
           const orderCards = ordersList.querySelectorAll('.order-history-card, .pro-order-item');
           if(orderCards.length > 0) {
              statCount.textContent = orderCards.length;
           } else if (ordersList.innerHTML.includes("No orders found")) {
              statCount.textContent = "0";
           }
        });
        observer.observe(ordersList, { childList: true, subtree: true });
      }

      // Handle Password Change
      const btnUpdatePassword = document.getElementById("btn-update-password");
      const passwordMsg = document.getElementById("password-msg");
      
      if(btnUpdatePassword) {
        btnUpdatePassword.addEventListener("click", () => {
          const newPassword = document.getElementById("profile-new-password").value;
          const user = firebase.auth().currentUser;
          
          if (!newPassword || newPassword.length < 6) {
            passwordMsg.style.display = "block";
            passwordMsg.style.color = "#d9534f";
            passwordMsg.textContent = "Password must be at least 6 characters long.";
            return;
          }

          if (user) {
            btnUpdatePassword.textContent = "Updating...";
            user.updatePassword(newPassword).then(() => {
              document.getElementById("profile-new-password").value = "";
              passwordMsg.style.display = "block";
              passwordMsg.style.color = "#57a05f"; // Success green
              passwordMsg.textContent = "Password updated successfully!";
              btnUpdatePassword.textContent = "Update Password";
              setTimeout(() => { passwordMsg.style.display = "none"; }, 3000);
            }).catch((error) => {
              passwordMsg.style.display = "block";
              passwordMsg.style.color = "#d9534f";
              passwordMsg.textContent = error.message;
              btnUpdatePassword.textContent = "Update Password";
            });
          }
        });
      }
    });
  </script>
