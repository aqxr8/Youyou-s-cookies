<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | YouYou's Cookies</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Upgraded Mobile Responsive Adaptation (PC remains untouched) */
    @media (max-width: 900px) {
      .profile-grid { grid-template-columns: 1fr !important; gap: 20px !important; }
      .section.container { padding-left: 15px !important; padding-right: 15px !important; padding-top: 20px !important; }
      
      /* Center and beautify the hero card on mobile */
      .profile-hero-card { 
        flex-direction: column; 
        align-items: center !important; 
        text-align: center;
        padding: 35px 20px !important;
        border-radius: 24px;
        background: linear-gradient(145deg, var(--white), var(--cream-light));
      }
      .profile-hero-card > div { 
        justify-content: center; 
        flex-direction: column; 
        display: flex; 
        align-items: center; 
      }
      .profile-avatar { 
        width: 110px; 
        height: 110px; 
        margin-bottom: 12px; 
        border-width: 4px; 
        box-shadow: 0 8px 24px rgba(193, 119, 30, 0.2); 
      }
      .profile-hero-card .btn { 
        width: 100%; 
        text-align: center; 
        margin-top: 15px; 
        padding: 14px; 
        border-radius: 12px; 
        font-weight: bold;
      }
      
      /* Enhance form cards */
      .profile-section-card { padding: 22px 18px !important; border-radius: 20px; }
      .auth-input { font-size: 16px !important; padding: 14px !important; border-radius: 10px !important; }
      .profile-card-title { font-size: 1.4rem; text-align: center; margin-bottom: 22px; }
      
      /* Clean up the basket items for small screens */
      .basket-item-row { 
        flex-direction: column !important; 
        align-items: flex-start !important; 
        gap: 12px; 
        padding: 18px 0; 
      }
      .basket-item-row > div:last-child { 
        align-self: flex-end; 
        font-size: 1.25rem !important; 
        background: var(--cream);
        padding: 6px 14px;
        border-radius: 8px;
      }
      
      /* Better order history stacking */
      .order-history-header { flex-direction: column; gap: 8px; }
      .order-history-header .status-pill-badge { align-self: flex-start; }
    }
  </style>
</head>
<body>

  <!-- Site Header with Theme Toggle -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="assets/images/logo.png" alt="YouYou's Cookies" class="brand-logo">
        <div class="brand-text">
          <b>YOUYOU'S COOKIES</b>
          <span>SETTAT, MOROCCO</span>
        </div>
      </a>

      <div style="display: flex; align-items: center; gap: 15px;">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
          <span class="moon-icon">🌙</span>
          <span class="sun-icon" style="display: none;">☀️</span>
        </button>
        <a href="index.html" class="btn btn-outline" style="color: var(--brown); border-color: rgba(74,55,40,0.2);">← Back to Shop</a>
      </div>
    </div>
  </header>

  <main class="section container" style="max-width: 1000px; padding-top: 40px;">
    
    <!-- Profile Hero -->
    <div class="profile-hero-card">
      <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap;">
        <img id="profile-picture" src="assets/images/logo.png" alt="Profile" class="profile-avatar">
        <div>
          <h1 id="profile-name" style="font-family: 'Cormorant Garamond', serif; font-size: 2.2rem; color: var(--brown); margin: 0;">Loading...</h1>
          <p id="profile-email" style="color: var(--brown-soft); margin: 2px 0 10px; font-size: 0.95rem;"></p>
          <span class="status-pill-badge delivered" style="font-size: 0.8rem;">Cookie Club Member</span>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-dark" style="padding: 10px 22px; font-size: 0.9rem;">Log Out</button>
    </div>

    <!-- Main Profile Grid -->
    <div class="profile-grid">
      
      <div style="display: flex; flex-direction: column; gap: 25px;">
        <div class="profile-section-card">
          <h3 class="profile-card-title">Personal Details</h3>
          <form id="profile-info-form">
            <div class="form-group">
              <label for="edit-username">Full Name</label>
              <input type="text" id="edit-username" class="auth-input" required>
            </div>
            <div class="form-group">
              <label for="edit-phone">Phone Number (WhatsApp Delivery)</label>
              <input type="tel" id="edit-phone" class="auth-input" autocomplete="tel" placeholder="+212 6XX-XXXXXX">
            </div>
            <div class="form-group">
              <label for="edit-address">Default Address (Settat)</label>
              <textarea id="edit-address" class="auth-input" style="min-height: 80px; resize: vertical;" placeholder="Street address, neighborhood..."></textarea>
            </div>
            <button type="submit" class="btn btn-dark" style="width: 100%;">Save Changes</button>
            <div id="info-msg" style="display: none; margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
          </form>
        </div>

        <div class="profile-section-card">
          <h3 class="profile-card-title">Security</h3>
          <form id="password-form">
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input type="password" id="new-password" class="auth-input" placeholder="••••••••" required minlength="6">
            </div>
            <button type="submit" class="btn btn-outline" style="width: 100%; color: var(--brown); border-color: rgba(74,55,40,0.3);">Update Password</button>
            <div id="password-msg" style="display: none; margin-top: 10px; font-size: 0.85rem; text-align: center;"></div>
          </form>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 25px;">
        <div class="profile-section-card">
          <h3 class="profile-card-title">Current Cookie Box</h3>
          <div id="profile-basket-list">
            <p style="color: var(--brown-soft); font-style: italic;">Loading your box...</p>
          </div>
        </div>

        <div class="profile-section-card">
          <h3 class="profile-card-title">Order History</h3>
          <div id="profile-order-history">
            <p style="color: var(--brown-soft); font-style: italic;">Loading orders...</p>
          </div>
        </div>
      </div>

    </div>

  </main>

  <!-- UPGRADED FLOATING CART DRAWER OVERLAY & PANEL -->
  <div id="cart-overlay" class="cart-overlay"></div>
  <div id="cart-panel" class="cart-drawer">
    <div class="cart-header">
      <h3>Your Sweet Box 🍪</h3>
      <button onclick="window.closeCart()" class="close-cart">&times;</button>
    </div>
    <div class="cart-body">
      <ul id="cart-items" class="cart-items-list"></ul>
    </div>
    <div class="cart-footer" id="cart-footer">
      <div class="cart-total-row">
        <span>Total:</span>
        <span><strong style="color: var(--caramel);"><span id="cart-total">0</span> DH</strong></span>
      </div>
      <button id="checkout-btn" class="btn btn-whatsapp" style="width: 100%;">Open Box & Checkout</button>
      <button id="clear-cart-btn" class="btn btn-outline" style="width: 100%; margin-top: 10px; font-size: 0.9rem; padding: 10px; color: var(--brown); border-color: rgba(74,55,40,0.3); background: transparent; transition: 0.2s;">🗑️ Empty Box</button>
    </div>
  </div>

  <!-- Order Confirmation Modal Popup -->
  <div id="checkout-confirm-modal" class="confirm-modal-overlay">
    <div class="confirm-modal-content">
      <div class="confirm-modal-header">
        <h3 style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; color: var(--brown); margin: 0;">Confirm Order</h3>
        <button id="close-confirm-modal" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--brown);">&times;</button>
      </div>

      <div class="confirm-order-summary">
        <strong>Items Summary:</strong>
        <pre id="confirm-items-summary" style="font-family: inherit; white-space: pre-wrap; margin: 8px 0; color: var(--brown);"></pre>
        <div style="text-align: right; font-weight: bold; color: var(--caramel); font-size: 1.1rem;">
          Total: <span id="confirm-total-price">0 DH</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirm-phone-input">Phone Number (WhatsApp):</label>
        <input type="tel" id="confirm-phone-input" class="auth-input" autocomplete="tel" inputmode="tel" placeholder="+212 6XX-XXXXXX" required>
      </div>

      <div class="form-group">
        <label for="confirm-address-input">Delivery Address in Settat:</label>
        <textarea id="confirm-address-input" class="auth-input" style="min-height: 60px;" placeholder="Neighborhood, street, building..."></textarea>
      </div>

      <!-- FIXED BUTTON WITH PROPER CLASS -->
      <button id="confirm-submit-order" class="btn btn-whatsapp" style="width: 100%; margin-top: 10px;">Confirm & Send via WhatsApp</button>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/features.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
